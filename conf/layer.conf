BBPATH .= ":${LAYERDIR}"

BBFILES += "\
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "elk"
BBFILE_PATTERN_elk = "^${LAYERDIR}/"
BBFILE_PRIORITY_elk = "8"
LAYERSERIES_COMPAT_elk = "wrynose"

# Set to "1" to install the web GUI stack (Node.js, Python web frameworks, nginx).
# Disabled by default, enable it from local.conf or a kas config: ELK_WEB_GUI = "1"
ELK_WEB_GUI ??= "0"
